# config/prices.yaml - list prices for the cost columns (USD per 1M tokens)
# as_of: 2026-10-23. Re-check before the final run and update the date.
as_of: "2026-10-23"

solutions:
  jev:
    provider: typesafe
    model: jev-latest              # jev-1.14.0 since mid-Oct 2026
    input: 0.042
    output: 0.0                    # decision models bill no output tokens
    source: "https://typesafe.ai/blog/introducing-system-one-models-and-jev"
  openai_decisions:
    provider: openai
    model: gpt-6-luna
    input: 0.10
    cached_input: 0.01             # assumption: Luna's cached price; confirm on the first call's usage
    output: 0.0
    source: "https://developers.openai.com/api/docs/guides/decisions"
  gpt_6_luna:
    provider: openai
    model: gpt-6-luna
    input: 0.10
    cached_input: 0.01
    cache_write: 0.125
    output: 0.50
    source: "https://developers.openai.com/api/docs/models/gpt-6-luna"
  gpt_5_6_terra:
    provider: openai
    model: gpt-5.6-terra
    input: 2.00
    output: 12.00
    source: "https://anotherwrapper.com/llm-pricing/gpt-5.6-terra (aggregator - confirm on OpenAI's pricing page)"

  # Local models via Ollama (>= 0.40.4) - no API bill; hardware and electricity not counted
  ollama_kev:
    provider: ollama
    model: kev:4b-q8_0             # Jared Palmer, Qwen3.5-4B + LoRA + pointer head; 4.5 GB; fallback: Kev's own server
    input: 0.0
    output: 0.0
  ollama_d1:
    provider: ollama
    model: d1                      # Liquid AI, 3B, LFM Open License v1.0
    input: 0.0
    output: 0.0
  ollama_tev1:
    provider: ollama
    model: tev1:4b                 # Together AI, Qwen3.5-4B fine-tune
    input: 0.0
    output: 0.0
  ollama_clef_flash:
    provider: ollama
    model: clef-flash                # Cloudflare, 9B, Qwen3.5-9B fine-tune, text and images
    input: 0.0
    output: 0.0
  ollama_laya:                     # optional
    provider: ollama
    model: laya                    # Convai Innovations, 421M ModernBERT encoder, English
    input: 0.0
    output: 0.0
  ollama_nimble:                   # optional
    provider: ollama
    model: nimble                  # Bespoke Labs, 9B
    input: 0.0
    output: 0.0
  ollama_llm:
    provider: ollama
    model: qwen3.5:9b              # or whichever Qwen3.5 / Gemma 4 tag `ollama list` shows
    input: 0.0
    output: 0.0

  reference_claude_opus:           # optional reference for the score questions
    provider: anthropic
    model: claude-opus-5-5         # confirm the exact model id
    input: 4.00
    output: 20.00
    source: "https://platform.claude.com/en/docs/about-claude/pricing"
